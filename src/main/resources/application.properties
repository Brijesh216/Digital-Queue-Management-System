spring.application.name=digital_queue_system

# ==========================================
# Server Configuration
# ==========================================
server.port=3000

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/digital_queue_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Hibernate/JPA Configuration
# ==========================================
# update: automatically updates schema on startup (changes only)
# validate: validates schema matches entities (fails if mismatch)
# create-drop: creates new schema on startup, drops on shutdown (development only)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==========================================
# Logging Configuration
# ==========================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.digitalqueue=DEBUG

# ==========================================
# JWT Configuration
# ==========================================
# Secret key for JWT signing (Change this to a strong secret in production!)
# In production, use environment variables or external config
jwt.secret=${JWT_SECRET}
# Token expiration time in milliseconds (24 hours)
jwt.expiration=86400000
